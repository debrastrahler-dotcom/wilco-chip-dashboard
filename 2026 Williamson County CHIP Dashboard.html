<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 Williamson County Community Health Improvement Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#f4f9fb;--surface:#fff;--ink:#0c3347;--muted:#4f6b78;--line:#d5e4ea;--accent:#0f6786;--brand:#0f6786;--gold:#f6c56f;
 --done:#0f6786;--track:#7db55a;--risk:#f6c56f;--behind:#e0873a;--idle:#bcd0da;--chip:#e3eff4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1f2b;--surface:#102c3b;--ink:#e8f3f7;--muted:#9fbac6;--line:#21465a;--accent:#6bc3e8;
 --done:#2bb5b0;--track:#8cc468;--behind:#e8954a;--idle:#3b5b6b;--chip:#173a4c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1f2b;--surface:#102c3b;--ink:#e8f3f7;--muted:#9fbac6;--line:#21465a;--accent:#6bc3e8;
 --done:#2bb5b0;--track:#8cc468;--behind:#e8954a;--idle:#3b5b6b;--chip:#173a4c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-size:14px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
header{position:relative;overflow:hidden;background:var(--brand);color:#fff;border-radius:16px;padding:30px 28px 30px 262px;min-height:250px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header>div,header>button{position:relative;z-index:1}
.photo{position:absolute;left:0;top:0;height:100%;width:auto;aspect-ratio:384/433;pointer-events:none}
.logo{display:block;width:60px;height:60px;margin-bottom:12px;border-radius:50%}
.rings{position:absolute;right:-70px;top:-90px;width:340px;height:340px;pointer-events:none}
h1{font-size:26px;line-height:1.25;margin:0 0 8px;font-weight:700;letter-spacing:-.01em;max-width:540px}
.sub{color:rgba(255,255,255,.88);margin:0;max-width:520px}
.theme{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}header button:focus-visible{outline-color:var(--gold)}
.banner{background:var(--chip);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:18px}
.summary{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:12px;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.summary .main{border-top:5px solid var(--gold)}
.big{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.lbl{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat{font-size:28px;font-weight:700;line-height:1}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools input{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ghead{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:18px 18px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center}
.gtitle{font-size:17px;font-weight:600;line-height:1.35}
.gmeta{color:var(--muted);font-size:12.5px;margin-top:2px}
.gpct{font-size:28px;font-weight:700;letter-spacing:-.02em;text-align:right}
.strip{grid-column:1/-1;display:flex;gap:3px;margin-top:6px}.strip span{flex:1;height:10px;border-radius:3px;min-width:4px}
.caret{display:inline-block;transition:transform .2s;margin-right:6px;color:var(--muted)}.goal.open .caret{transform:rotate(90deg)}
.gbody{display:none;border-top:1px solid var(--line);padding:6px 18px 14px}.goal.open .gbody{display:block}
.obj{padding:16px 0;border-bottom:1px solid var(--line)}.obj:last-child{border-bottom:0}
.otop{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.otitle{font-weight:600;line-height:1.4}.opct{font-weight:600;white-space:nowrap}
.strat{display:grid;grid-template-columns:1fr 110px 110px;gap:12px;align-items:center;padding:8px 0 8px 14px;border-left:3px solid var(--line);margin-top:8px}
.sname{font-size:13.5px}
.mini{height:6px;background:var(--chip);border-radius:99px;overflow:hidden}.mini i{display:block;height:100%;border-radius:99px}
.tag{font-size:12px;font-weight:600;display:inline-flex;align-items:center}
.kh{font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 0 4px}
.kpi{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.kpi small{color:var(--muted)}.kv{text-align:right;white-space:nowrap}.kv b{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px}
@media (max-width:760px){.photo{display:none}header{padding:24px 20px;min-height:0}.summary{grid-template-columns:1fr 1fr}.summary .main{grid-column:1/-1}
 .strat{grid-template-columns:1fr 100px}.strat .mini{grid-column:1/-1;order:3}.kpi{grid-template-columns:1fr}.kv{text-align:left}}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}
</style>
</head>

  k:[["Opioid overdose deaths per 100,000 (age-adjusted)","Texas VSTAT","7.0 (2024)","6.65"]]}]}
];
var SAMPLE=[[70,"track"],[55,"track"],[30,"risk"],[15,"behind"],[80,"track"],[100,"complete"],[45,"risk"],[60,"track"],[25,"risk"],[50,"track"],[35,"risk"],[10,"behind"],[90,"complete"],[65,"track"],[40,"risk"],[20,"behind"],[55,"track"]];
var n=0;DATA.forEach(function(g){g.o.forEach(function(o){o.s=o.s.map(function(t){return{t:t,i:n++}})})});
var filter="all",query="",demo=false,openSet={0:true};
function sv(s){return demo?{pct:SAMPLE[s.i][0],st:SAMPLE[s.i][1]}:{pct:0,st:"idle"}}
function avg(a){return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length):0}
function objPct(o){return avg(o.s.map(function(s){return sv(s).pct}))}
function goalPct(g){return avg(g.o.map(objPct))}
function allS(g){var r=[];g.o.forEach(function(o){r=r.concat(o.s)});return r}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pctTxt(p){return demo?p+"%":"&ndash;"}
function renderSummary(){
 var all=[],kp=0,ob=0;DATA.forEach(function(g){all=all.concat(allS(g));ob+=g.o.length;g.o.forEach(function(o){kp+=o.k.length})});
 var overall=avg(DATA.map(goalPct)),cnt={};all.forEach(function(s){var k=sv(s).st;cnt[k]=(cnt[k]||0)+1});
 var h='<div class="panel main"><div class="big">'+(demo?overall+'%':'&ndash;')+'</div><div class="lbl">'+(demo?'Sample progress across ':'Progress will appear once updates are reported across ')+DATA.length+' goals, '+ob+' objectives, and '+all.length+' strategies</div><div class="bar"><i style="width:'+(demo?overall:0)+'%"></i></div></div>';
 var cards=demo?["complete","track","risk","behind"].map(function(k){return[cnt[k]||0,'<span class="dot" style="background:'+ST[k].c+'"></span>'+ST[k].n]}):[[DATA.length,"Goals"],[ob,"Objectives"],[all.length,"Strategies"],[kp,"Indicators tracked"]];
 cards.forEach(function(c){h+='<div class="panel"><div class="stat">'+c[0]+'</div><div class="lbl">'+c[1]+'</div></div>'});
 document.getElementById("summary").innerHTML=h;
 document.getElementById("banner").textContent=demo?"Sample progress shown for design preview only. These statuses are not real.":"Goals, objectives, strategies, and indicators come from the 2026 CHIP Workplan. Progress will fill in once updates are added in Quickbase.";
}
function renderChips(){
 var o=[["all","All"],["track","On track"],["risk","At risk"],["behind","Behind"],["complete","Complete"],["idle","Awaiting update"]];
 document.getElementById("chips").innerHTML=o.map(function(x){return'<button type="button" class="chip" data-f="'+x[0]+'" aria-pressed="'+(filter===x[0])+'">'+x[1]+'</button>'}).join("");
}
function match(s,o,g){
 if(filter!=="all"&&sv(s).st!==filter)return false;
 return !query||(s.t+" "+o.t+" "+g.t+" "+g.grp).toLowerCase().indexOf(query)>-1;
}
function renderGoals(){
 var out="",any=false;
 DATA.forEach(function(g,gi){
  var objs=[];g.o.forEach(function(o,oi){var ss=o.s.filter(function(s){return match(s,o,g)});if(ss.length)objs.push({o:o,ss:ss,oi:oi})});
  if(!objs.length)return;any=true;
  var strip=allS(g).map(function(s){var v=sv(s);return'<span title="'+ST[v.st].n+'" style="background:'+ST[v.st].c+'"></span>'}).join("");
  var isOpen=openSet[gi]||query||filter!=="all";
  out+='<section class="goal'+(isOpen?' open':'')+'"><button type="button" class="ghead" data-g="'+gi+'" aria-expanded="'+(!!isOpen)+'"><div><div class="gtitle"><span class="caret" aria-hidden="true">&#9656;</span>Goal '+(gi+1)+': '+esc(g.t)+'</div><div class="gmeta">'+esc(g.g)+'</div><div class="gmeta">'+esc(g.grp)+' action group &middot; '+g.o.length+(g.o.length>1?' objectives':' objective')+' &middot; '+allS(g).length+' strategies</div></div><div class="gpct">'+pctTxt(goalPct(g))+'</div><div class="strip" aria-hidden="true">'+strip+'</div></button><div class="gbody">';
  objs.forEach(function(x){
   out+='<div class="obj"><div class="otop"><div class="otitle">Objective '+(x.oi+1)+': '+esc(x.o.t)+'</div><div class="opct">'+pctTxt(objPct(x.o))+'</div></div>';
   x.ss.forEach(function(s){var v=sv(s),st=ST[v.st];
    out+='<div class="strat" style="border-left-color:'+st.c+'"><div class="sname">'+esc(s.t)+'</div><div class="mini" role="img" aria-label="'+v.pct+'% complete"><i style="width:'+v.pct+'%;background:'+st.c+'"></i></div><div class="tag"><span class="dot" style="background:'+st.c+'"></span>'+st.n+'</div></div>';
   });
   if(filter==="all"){out+='<div class="kh">Key performance indicators</div>';
    x.o.k.forEach(function(k){out+='<div class="kpi"><div>'+esc(k[0])+'<br><small>'+esc(k[1])+'</small></div><div class="kv">Baseline '+esc(k[2])+' &rarr; Goal <b>'+esc(k[3])+'</b></div></div>'})}
   out+='</div>';
  });
  out+='</div></section>';
 });
 document.getElementById("goals").innerHTML=any?out:'<div class="empty">No strategies match. Clear the search or choose All.</div>';
}
function all(){renderSummary();renderChips();renderGoals()}
document.getElementById("chips").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;filter=b.dataset.f;renderChips();renderGoals()});
document.getElementById("goals").addEventListener("click",function(e){
 var b=e.target.closest(".ghead");if(!b||query||filter!=="all")return;var i=b.dataset.g;openSet[i]=!openSet[i];renderGoals();
 var nb=document.querySelector('.ghead[data-g="'+i+'"]');if(nb)nb.focus();
});
document.getElementById("q").addEventListener("input",function(e){query=e.target.value.trim().toLowerCase();renderGoals()});
document.getElementById("demo").addEventListener("click",function(e){demo=!demo;e.target.setAttribute("aria-pressed",demo);e.target.textContent=demo?"Hide sample progress":"Preview sample progress";all()});
document.getElementById("theme").addEventListener("click",function(){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark"});
all();
</script>
</body>
</html>
